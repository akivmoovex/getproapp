<!-- Micro-interactions Script -->
<script>
        // Toggle Switch Logic
        const toggle = document.getElementById('toggle-switch');
        const dot = toggle.querySelector('div');
        let isActive = false;

        toggle.addEventListener('click', () => {
            isActive = !isActive;
            if (isActive) {
                toggle.classList.replace('bg-outline-variant', 'bg-primary');
                dot.classList.replace('translate-x-0', 'translate-x-6');
            } else {
                toggle.classList.replace('bg-primary', 'bg-outline-variant');
                dot.classList.replace('translate-x-6', 'translate-x-0');
            }
        });

        // Simple feedback on list items
        const buttons = document.querySelectorAll('main button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.7';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
