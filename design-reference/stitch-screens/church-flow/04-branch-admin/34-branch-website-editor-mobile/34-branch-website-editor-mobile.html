<div class="w-8 h-8 rounded-full bg-primary-fixed overflow-hidden border border-outline-variant">

<h2 class="font-title-lg text-title-lg font-bold">Kafue Baptist Church</h2>
</div>
<button class="absolute top-4 right-4 bg-white/20 backdrop-blur-md text-white px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 border border-white/30">
<span class="material-symbols-outlined text-sm">visibility</span> View Site
            </button>
</section>
<!-- Editor Form -->
<form class="space-y-8" onsubmit="event.preventDefault()">
<!-- Section: Identity -->

<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">church</span>

</div>
<div class="space-y-4">
<div class="relative">

</div>
<div class="relative">

</div>
</div>
<!-- Section: Service Times -->

<button class="mt-5 text-error">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="flex items-center justify-between gap-4">
<div class="flex-1">

</div>

</button>
</div>

</div>

</div>
</div>
</div>

</div>
<button class="text-primary">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
</div>
</div>

</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface border-t border-outline-variant flex gap-3 z-50">

            Discard
        </button>
<button class="flex-[2] h-12 bg-primary text-on-primary font-bold rounded-full shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined">publish</span>
            Update Site
        </button>
</div>
<!-- Persistent Bottom Nav (Mobile Logic) -->
<!-- Suppressed due to "Task-Focused" rule in system instructions: Page has "Back" action implies temporary departure from global nav -->
<script>
        // Micro-interaction for feedback on click
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                let ripple = document.createElement('div');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Simple validation visualization
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if(input.value.trim() === "") {
                    input.classList.add('border-error');
                } else {
                    input.classList.remove('border-error');
                }
            });
        });
    </script>
