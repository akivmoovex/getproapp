name: V12 BlessBoard Browser CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blessboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getpro_bb_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d getpro_bb_browser_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DEPLOYMENT_ENV: testing
      EXPECTED_DATABASE_ENV: testing
      GETPRO_TEST_DB: "1"
      GETPRO_PG_SSL: "off"
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_bb_browser_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_bb_browser_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_bb_browser_ci
      PLAYWRIGHT_E2E_PORT: "4185"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Bootstrap disposable Foundation database
        env:
          DATABASE_IDENTITY_EXPECTED: moovex-platform-v7
          DATABASE_IDENTITY_ENV: testing
          FOUNDATION_ALLOW_LOCALHOST: "1"
        run: |
          npm run db:bootstrap:foundation
          npm run db:verify:foundation
          npm run test:db:schema
          npm run church:db-identity:init -- --env testing --confirm
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate isolated CI TLS certificate
        run: |
          set -eu
          CERT_DIR="$RUNNER_TEMP/getpro-bb-tls"
          mkdir -p "$CERT_DIR"
          openssl genrsa -out "$CERT_DIR/ca.key" 2048
          openssl req -x509 -new -nodes -key "$CERT_DIR/ca.key" -sha256 -days 1 \
            -out "$CERT_DIR/ca.crt" -subj "/CN=GetPro CI BlessBoard Test CA"
          openssl genrsa -out "$CERT_DIR/local.test.key" 2048
          openssl req -new -key "$CERT_DIR/local.test.key" -out "$CERT_DIR/local.test.csr" \
            -subj "/CN=local.test"
          printf '%s\n' \
            'subjectAltName=DNS:local.test,DNS:*.local.test,DNS:admin.local.test' \
            'basicConstraints=CA:FALSE' > "$CERT_DIR/local.test.ext"
          openssl x509 -req -in "$CERT_DIR/local.test.csr" -CA "$CERT_DIR/ca.crt" \
            -CAkey "$CERT_DIR/ca.key" -CAcreateserial -out "$CERT_DIR/local.test.crt" \
            -days 1 -sha256 -extfile "$CERT_DIR/local.test.ext"
          sudo cp "$CERT_DIR/ca.crt" /usr/local/share/ca-certificates/getpro-bb-ci.crt
          sudo update-ca-certificates
          echo "BB_TLS_CERT_DIR=$CERT_DIR" >> "$GITHUB_ENV"
      - name: Run real BlessBoard foundation browser suite
        run: npx playwright test --config=playwright.foundation.config.cjs
      - name: Mark and collect server lifecycle diagnostics
        if: always()
        run: |
          printf '%s WORKFLOW_DIAGNOSTIC_COLLECTION %s\n' "$(date -u +%FT%TZ)" '{"status":"collecting"}' >> test-results/foundation-e2e/bb-lifecycle.log 2>/dev/null || true
      - name: Report current BB smoke coverage
        if: always()
        run: |
          echo "Historical target: 16 checks"
          echo "Current executable foundation suite: tests/e2e/foundation-security.spec.js"
          echo "Coverage is reported by Playwright; no placeholder checks are added."
      - name: Upload sanitized Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-blessboard-playwright-report
          path: |
            playwright-report/foundation-e2e
            test-results/foundation-e2e
            bb-lifecycle.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated CI HTTPS termination
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/getpro-bb-tls/proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/getpro-bb-tls/proxy.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/getpro-bb-tls/ca.key" \
            "$RUNNER_TEMP/getpro-bb-tls/local.test.key"
