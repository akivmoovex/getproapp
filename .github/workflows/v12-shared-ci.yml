name: V12 Shared CI

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable approved test SHA; omit only for manual current-ref mode"
        required: false
        type: string

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getpro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d getpro_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DEPLOYMENT_ENV: testing
      GETPRO_TEST_DB: "1"
      GETPRO_PG_SSL: "off"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_ci
      GETPRO_DB_MISSING_EXIT_DELAY_MS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || github.ref }}
      - name: Verify pinned test checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -eu
          if [ -n "$TARGET_SHA" ]; then
            printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
            git fetch --no-tags origin V12
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"
            git merge-base --is-ancestor "$TARGET_SHA" origin/V12
          fi
          printf 'CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax validation
        run: |
          node --check tests/qa/overnight/combinedNightlyCoordinator.js
          node --check tests/qa/overnight/dailyQaMasterRunner.js
          node --check tests/qa/overnight/runtime/qaDockerRuntime.js
      - name: Shared architecture and secret checks
        run: |
          npm run test:architecture
          node --test tests/committed-secret-hygiene.test.js
          npm run check:ejs-partials
      - name: Portable QA guard tests
        run: node --test tests/qa/overnight/security/*.test.js
