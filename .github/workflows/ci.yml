name: CI

on:
  push:
    branches: [main, v2, V7]
  pull_request:
    branches: [main, v2, V7]

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Committed secret hygiene
        run: node --test tests/committed-secret-hygiene.test.js

  component-check:
    if: >
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'v2')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'v2'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getpro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d getpro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GETPRO_TEST_DB: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/getpro_ci
      GETPRO_PG_SSL: "off"
      GETPRO_DB_MISSING_EXIT_DELAY_MS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: EJS include paths (static partial resolution)
        run: npm run check:ejs-partials

      - name: Front-end production bundle (Vite)
        run: npm run build:assets

      - name: Stylelint (CSS + component boundaries)
        run: npm run lint:css

      - name: CSS boundary baseline (no new external overrides on .c-*)
        env:
          CI: true
        run: npm run lint:css-boundaries:ci

      - name: Enforce no legacy .btn in public templates
        env:
          CI: true
        run: npm run lint:components:enforce-btn

      - name: Component baseline check (new violations only)
        env:
          CI: true
        run: npm run lint:components:ci

      - name: Prepare Playwright test database
        run: |
          npm run test:db:schema
          node scripts/seed-playwright-visual-fixtures.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression (Playwright)
        env:
          CI: true
          ADMIN_PASSWORD: ci-playwright-admin-not-secret
        run: npm run test:ui
